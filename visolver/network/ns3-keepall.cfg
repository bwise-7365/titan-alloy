# NS3 experiment: 200-node banded, KEEP-ALL (no screen, no certificate
# rounds needed -- nothing is excluded, so the round-0 answer is exact by
# construction), interior-point engine with the NS2 structured Newton
# factory (per-sink Sherman-Morrison + dual Schur) instead of dense LU.
#   Usage: network_benchmark <path-to-this-file>   (Release build!)
# Expectation (engine plan, NS3): tens of IPM iterations at Newton dimension
# ~14,601, but each iteration O(pairs) + a ~101^2 LLT instead of dense
# dim^3 -- seconds-scale linear algebra; the engine's own O(dim^2) residual
# matvecs and the one-time dense M assembly (~1.7 GB) set the floor.
# Compare against the IP4a screened ipm probe (35 iters, ~30 min) and the
# greedy+swap baseline.

benchmark.name = 200 nodes banded, keep-all, ipm + flow Newton (NS3)
benchmark.instances = 1
benchmark.seedBase = 20260704

# --- instance shape (the 200-node banded stress case, as IP4a) ---
profile.numSupplyOnly = 50
profile.numBoth = 50
profile.numDemandOnly = 95
profile.numNeither = 5
profile.laydownType = 1

# --- NO screen: keep every source-sink pair; certificate loop is a no-op ---
screen.maxSourcesPerSink = 0
screen.gapFraction = 0.0
screen.maxCertificateRounds = 0

# --- solver: interior point + structured Newton ---
solver.engine = ipm
solver.ipmNewton = flow
solver.iterMax = 200          # counts factorizations under ipm
# solver.newtonCheckTol = 1.0e-8   # uncomment to have the engine verify
                                   # every structured solve against M
                                   # (adds one O(dim^2) matvec per solve)

