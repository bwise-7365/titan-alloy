# Example runtime configuration for network_benchmark (task E1).
#   Usage: network_benchmark <path-to-this-file>
# Every key is optional -- omitted keys keep their compiled defaults.
# Unknown or misspelled keys are ERRORS (the run refuses to start), so a
# typo can never silently do nothing. Full key list: include/config.hpp.

benchmark.name = 200 nodes banded, gap screen experiment
benchmark.instances = 1
benchmark.seedBase = 20260704

# --- instance shape (the 200-node banded stress case) ---
profile.numSupplyOnly = 50
profile.numBoth = 50
profile.numDemandOnly = 95
profile.numNeither = 5
profile.laydownType = 1

# --- screen: union of count and gap rules; certificate restores exactness ---
screen.maxSourcesPerSink = 10
screen.gapFraction = 0.02
screen.certificateSlack = 1.0e-4
screen.maxCertificateRounds = 10

# --- solver ---
# The E4 experiment: run once with each engine and compare.
solver.engine = chain         # chain bshe94b (default) | chain = SS warm start
# solver.roughMagTol = 1.0e-4 # chain phase-1 target (squared, scaled units)
# solver.roughIterMax = 20000 # chain phase-1 cap
solver.iterMax = 150000
# solver.magTol = 1.0e-12
# solver.epsilon = 1.0e-5     # stronger tie-break; R4 bounds its cost by
                              # epsilon * L (anti-degeneracy experiment)

