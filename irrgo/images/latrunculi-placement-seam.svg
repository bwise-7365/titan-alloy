<svg xmlns="http://www.w3.org/2000/svg" width="320" height="440" viewBox="0 0 320 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c01c28"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="320" height="440" fill="#fdfbf7"/>
  <text x="160" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">One-move capture at the seam (F10, A1)</text>

  <!-- 6x6 board at (28,44) -->
  <rect x="28" y="44" width="264" height="264" fill="#ecdcb4" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#b09868" stroke-width="1">
    <line x1="72" y1="44" x2="72" y2="308"/><line x1="116" y1="44" x2="116" y2="308"/>
    <line x1="160" y1="44" x2="160" y2="308"/><line x1="204" y1="44" x2="204" y2="308"/>
    <line x1="248" y1="44" x2="248" y2="308"/>
    <line x1="28" y1="88" x2="292" y2="88"/><line x1="28" y1="132" x2="292" y2="132"/>
    <line x1="28" y1="176" x2="292" y2="176"/><line x1="28" y1="220" x2="292" y2="220"/>
    <line x1="28" y1="264" x2="292" y2="264"/>
  </g>
  <!-- Completing square (3,4), red -->
  <rect x="204" y="176" width="44" height="44" fill="#c01c28" fill-opacity="0.22" stroke="#c01c28" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Black stone with an enemy jaw already adjacent -->
  <circle cx="182" cy="198" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="182" cy="198" r="21" fill="none" stroke="#c01c28" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="138" cy="198" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <!-- White striker at (0,4) slides down to (3,4) -->
  <circle cx="226" cy="66" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <line x1="226" y1="86" x2="226" y2="174" stroke="#c01c28" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <text x="160" y="336" text-anchor="middle" font-size="12" fill="#333">An enemy jaw adjacent, the opposite square empty</text>
  <text x="160" y="352" text-anchor="middle" font-size="12" fill="#333">and reachable: this stone dies on the first move</text>
  <text x="160" y="368" text-anchor="middle" font-size="12" fill="#333">of the movement phase. The last placer must</text>
  <text x="160" y="384" text-anchor="middle" font-size="12" fill="#333">leave none of these.</text>

  <circle cx="90" cy="412" r="6" fill="#2e2a26" stroke="#000"/>
  <text x="101" y="416" font-size="12" fill="#333">Black (you)</text>
  <circle cx="190" cy="412" r="6" fill="#f7f2e7" stroke="#5a5248" stroke-width="1.5"/>
  <text x="201" y="416" font-size="12" fill="#333">White (enemy)</text>
</svg>
