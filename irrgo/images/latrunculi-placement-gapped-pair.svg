<svg xmlns="http://www.w3.org/2000/svg" width="280" height="380" viewBox="0 0 280 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c01c28"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f3d6d6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c01c28" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="280" height="380" fill="#fdfbf7"/>
  <text x="140" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The gapped pair (F5)</text>

  <!-- 5x5 board at (30,44) -->
  <rect x="30" y="44" width="220" height="220" fill="#ecdcb4" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#b09868" stroke-width="1">
    <line x1="74" y1="44" x2="74" y2="264"/><line x1="118" y1="44" x2="118" y2="264"/>
    <line x1="162" y1="44" x2="162" y2="264"/><line x1="206" y1="44" x2="206" y2="264"/>
    <line x1="30" y1="88" x2="250" y2="88"/><line x1="30" y1="132" x2="250" y2="132"/>
    <line x1="30" y1="176" x2="250" y2="176"/><line x1="30" y1="220" x2="250" y2="220"/>
  </g>
  <!-- Denied gap (2,2) -->
  <rect x="118" y="132" width="44" height="44" fill="url(#hatch)" stroke="#c01c28" stroke-width="1.5"/>
  <!-- Black pair with gap -->
  <circle cx="96"  cy="154" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="184" cy="154" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <!-- White stone that cannot come to rest in the gap -->
  <circle cx="140" cy="66" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <line x1="140" y1="86" x2="140" y2="124" stroke="#c01c28" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>

  <text x="140" y="292" text-anchor="middle" font-size="12" fill="#333">White may slide through the gap but can never</text>
  <text x="140" y="308" text-anchor="middle" font-size="12" fill="#333">stop there: placing is walking into a flank,</text>
  <text x="140" y="324" text-anchor="middle" font-size="12" fill="#333">moving there is suicide. Black may still use it.</text>

  <circle cx="60" cy="352" r="6" fill="#2e2a26" stroke="#000"/>
  <text x="71" y="356" font-size="12" fill="#333">Black (you)</text>
  <circle cx="160" cy="352" r="6" fill="#f7f2e7" stroke="#5a5248" stroke-width="1.5"/>
  <text x="171" y="356" font-size="12" fill="#333">White (enemy)</text>
</svg>
