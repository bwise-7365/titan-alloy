<svg xmlns="http://www.w3.org/2000/svg" width="540" height="410" viewBox="0 0 540 410" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5fb4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="540" height="410" fill="#fdfbf7"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Contact and the spearhead (F4, H5)</text>
  <text x="130" y="52" text-anchor="middle" font-size="13" fill="#222">Unbacked contact — mutual</text>
  <text x="390" y="52" text-anchor="middle" font-size="13" fill="#222">Spearhead — one-sided</text>

  <!-- Panel A: 5x5 board at (20,64) -->
  <rect x="20" y="64" width="220" height="220" fill="#ecdcb4" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#b09868" stroke-width="1">
    <line x1="64" y1="64" x2="64" y2="284"/><line x1="108" y1="64" x2="108" y2="284"/>
    <line x1="152" y1="64" x2="152" y2="284"/><line x1="196" y1="64" x2="196" y2="284"/>
    <line x1="20" y1="108" x2="240" y2="108"/><line x1="20" y1="152" x2="240" y2="152"/>
    <line x1="20" y1="196" x2="240" y2="196"/><line x1="20" y1="240" x2="240" y2="240"/>
  </g>
  <!-- White's completing square against Black: (2,1), red -->
  <rect x="64" y="152" width="44" height="44" fill="#c01c28" fill-opacity="0.22" stroke="#c01c28" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Black's completing square against White: (2,4), blue -->
  <rect x="196" y="152" width="44" height="44" fill="#1a5fb4" fill-opacity="0.18" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="130" cy="174" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="174" cy="174" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>

  <!-- Panel B: 5x5 board at (280,64) -->
  <rect x="280" y="64" width="220" height="220" fill="#ecdcb4" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#b09868" stroke-width="1">
    <line x1="324" y1="64" x2="324" y2="284"/><line x1="368" y1="64" x2="368" y2="284"/>
    <line x1="412" y1="64" x2="412" y2="284"/><line x1="456" y1="64" x2="456" y2="284"/>
    <line x1="280" y1="108" x2="500" y2="108"/><line x1="280" y1="152" x2="500" y2="152"/>
    <line x1="280" y1="196" x2="500" y2="196"/><line x1="280" y1="240" x2="500" y2="240"/>
  </g>
  <!-- Black's completing square (2,4), blue -->
  <rect x="456" y="152" width="44" height="44" fill="#1a5fb4" fill-opacity="0.18" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Backed pair + enemy -->
  <circle cx="346" cy="174" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="346" cy="174" r="21" fill="none" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="390" cy="174" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="434" cy="174" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <circle cx="434" cy="174" r="21" fill="none" stroke="#c01c28" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Black striker at (0,4) slides down to (2,4) -->
  <circle cx="478" cy="86" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <line x1="478" y1="106" x2="478" y2="150" stroke="#1a5fb4" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <!-- Captions -->
  <text x="130" y="312" text-anchor="middle" font-size="12" fill="#333">Contact without backing: each side has a</text>
  <text x="130" y="328" text-anchor="middle" font-size="12" fill="#333">completing square against the other (red =</text>
  <text x="130" y="344" text-anchor="middle" font-size="12" fill="#333">theirs, blue = yours). The threat is symmetric.</text>
  <text x="390" y="312" text-anchor="middle" font-size="12" fill="#333">The backer (green) blocks White's jaw, so the</text>
  <text x="390" y="328" text-anchor="middle" font-size="12" fill="#333">threat is one-sided: one slide to the blue</text>
  <text x="390" y="344" text-anchor="middle" font-size="12" fill="#333">square captures.</text>

  <circle cx="160" cy="382" r="6" fill="#2e2a26" stroke="#000"/>
  <text x="171" y="386" font-size="12" fill="#333">Black (you)</text>
  <circle cx="270" cy="382" r="6" fill="#f7f2e7" stroke="#5a5248" stroke-width="1.5"/>
  <text x="281" y="386" font-size="12" fill="#333">White (enemy)</text>
</svg>
