<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="280" height="350" fill="#fdfbf7"/>
  <text x="140" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The 2x2 block (F3)</text>

  <!-- 5x5 board at (30,44) -->
  <rect x="30" y="44" width="220" height="220" fill="#ecdcb4" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#b09868" stroke-width="1">
    <line x1="74" y1="44" x2="74" y2="264"/><line x1="118" y1="44" x2="118" y2="264"/>
    <line x1="162" y1="44" x2="162" y2="264"/><line x1="206" y1="44" x2="206" y2="264"/>
    <line x1="30" y1="88" x2="250" y2="88"/><line x1="30" y1="132" x2="250" y2="132"/>
    <line x1="30" y1="176" x2="250" y2="176"/><line x1="30" y1="220" x2="250" y2="220"/>
  </g>
  <!-- Safe-block outline -->
  <rect x="74" y="88" width="88" height="88" rx="6" fill="none" stroke="#2e8b57" stroke-width="2.5"/>
  <!-- Black 2x2 at rows 1-2, cols 1-2 -->
  <circle cx="96"  cy="110" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="140" cy="110" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="96"  cy="154" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="140" cy="154" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <!-- White attackers all around -->
  <circle cx="96"  cy="66"  r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <circle cx="52"  cy="110" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <circle cx="184" cy="154" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <circle cx="140" cy="198" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>

  <text x="140" y="290" text-anchor="middle" font-size="12" fill="#333">Fully surrounded, still uncapturable: every</text>
  <text x="140" y="306" text-anchor="middle" font-size="12" fill="#333">flanking pair contains a friendly stone.</text>

  <circle cx="60" cy="330" r="6" fill="#2e2a26" stroke="#000"/>
  <text x="71" y="334" font-size="12" fill="#333">Black (you)</text>
  <circle cx="160" cy="330" r="6" fill="#f7f2e7" stroke="#5a5248" stroke-width="1.5"/>
  <text x="171" y="334" font-size="12" fill="#333">White (enemy)</text>
</svg>
