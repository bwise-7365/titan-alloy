<svg xmlns="http://www.w3.org/2000/svg" width="300" height="390" viewBox="0 0 300 390" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5fb4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="300" height="390" fill="#fdfbf7"/>
  <text x="150" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The diagonal's cross-fire (F6, H4)</text>

  <!-- 5x5 board at (30,44) -->
  <rect x="30" y="44" width="220" height="220" fill="#ecdcb4" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#b09868" stroke-width="1">
    <line x1="74" y1="44" x2="74" y2="264"/><line x1="118" y1="44" x2="118" y2="264"/>
    <line x1="162" y1="44" x2="162" y2="264"/><line x1="206" y1="44" x2="206" y2="264"/>
    <line x1="30" y1="88" x2="250" y2="88"/><line x1="30" y1="132" x2="250" y2="132"/>
    <line x1="30" y1="176" x2="250" y2="176"/><line x1="30" y1="220" x2="250" y2="220"/>
  </g>
  <!-- Notch squares (2,2) and (3,1), amber -->
  <rect x="118" y="132" width="44" height="44" fill="#e6a50a" fill-opacity="0.25"/>
  <rect x="74"  y="176" width="44" height="44" fill="#e6a50a" fill-opacity="0.25"/>
  <!-- Completing squares (1,2) and (2,3), blue -->
  <rect x="118" y="88"  width="44" height="44" fill="#1a5fb4" fill-opacity="0.18" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="162" y="132" width="44" height="44" fill="#1a5fb4" fill-opacity="0.18" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Black diagonal -->
  <circle cx="96"  cy="154" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <circle cx="140" cy="198" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <!-- White stone that entered the notch (2,2) -->
  <circle cx="140" cy="154" r="16" fill="#f7f2e7" stroke="#5a5248" stroke-width="2"/>
  <circle cx="140" cy="154" r="21" fill="none" stroke="#c01c28" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Black striker at (1,4) slides to (1,2) -->
  <circle cx="228" cy="110" r="16" fill="#2e2a26" stroke="#000" stroke-width="1.5"/>
  <line x1="206" y1="110" x2="150" y2="110" stroke="#1a5fb4" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <text x="150" y="292" text-anchor="middle" font-size="12" fill="#333">White entered the notch (amber): half-pinned on</text>
  <text x="150" y="308" text-anchor="middle" font-size="12" fill="#333">both axes at once. Either blue square completes;</text>
  <text x="150" y="324" text-anchor="middle" font-size="12" fill="#333">the slide shown captures immediately.</text>

  <circle cx="70" cy="352" r="6" fill="#2e2a26" stroke="#000"/>
  <text x="81" y="356" font-size="12" fill="#333">Black (you)</text>
  <circle cx="170" cy="352" r="6" fill="#f7f2e7" stroke="#5a5248" stroke-width="1.5"/>
  <text x="181" y="356" font-size="12" fill="#333">White (enemy)</text>
</svg>
